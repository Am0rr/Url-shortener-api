<div class="page">
  <h1>About</h1>

  @if (!editing()) {
    <p class="about-text">{{ content()?.text }}</p>
    @if (content()?.updatedAt) {
      <p class="meta">
        Last updated {{ content()?.updatedAt | date: 'medium' }} by {{ content()?.lastModifiedByEmail }}
      </p>
    }
    @if (isAdmin()) {
      <button type="button" (click)="startEdit()">Edit</button>
    }
  } @else {
    <form [formGroup]="form" (ngSubmit)="save()">
      <textarea formControlName="text" rows="8"></textarea>
      @if (errorMessage()) {
        <p class="form-error">{{ errorMessage() }}</p>
      }
      <div class="actions">
        <button type="submit" [disabled]="submitting()">Save</button>
        <button type="button" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>
  }
</div>
